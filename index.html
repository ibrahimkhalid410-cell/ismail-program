<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B10">
<script>try{var t=localStorage.getItem("isml_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="$ISML">
<title>$ISML · Ismail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070B10'/%3E%3Cpath d='M10 46 L24 32 L33 39 L53 17' stroke='%2300D27A' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#070B10; --bg2:#0B1118; --panel:#0F1720; --panel2:#131D28; --line:#1C2835; --line2:#26364A;
  --txt:#E8EEF4; --mut:#8395A7; --dim:#5A6B7C;
  --up:#00D27A; --upd:#00A862; --upg:rgba(0,210,122,.14);
  --dn:#FF5468; --gold:#F5B841; --goldg:rgba(245,184,65,.14); --blue:#4DA3FF;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --sans:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --r:16px; --safe-b:env(safe-area-inset-bottom,0px);
  --onup:#03140B; --ongold:#1C1302; --tapebg:#05080C; --tabsbg:rgba(5,8,12,.96); --headbg:rgba(7,11,16,.94); --restbg:#0E1A14;
  --name1:#fff; --name2:#C9D6E3; --ghost:#B9A6FF; --bannertxt:#F8D58A; --glow:rgba(0,210,122,.08); --shadow:rgba(0,0,0,.55);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F3F6F4; --bg2:#EDF2EF; --panel:#FFFFFF; --panel2:#F8FBF9; --line:#DCE4E0; --line2:#C6D2CC;
  --txt:#0B1A14; --mut:#4C6157; --dim:#7A8B83; --up:#008A4B; --upd:#006E3B; --upg:rgba(0,138,75,.10);
  --dn:#D12A3C; --gold:#A86F00; --goldg:rgba(168,111,0,.10); --onup:#FFFFFF; --ongold:#FFFFFF; --tapebg:#0B1A14; --tabsbg:rgba(255,255,255,.96); --headbg:rgba(243,246,244,.95); --restbg:#E9F7EF;
  --name1:#0B1A14; --name2:#2D4A3D; --ghost:#5B3FD6; --bannertxt:#6B4700; --glow:rgba(0,138,75,.07); --shadow:rgba(20,40,30,.18); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F3F6F4; --bg2:#EDF2EF; --panel:#FFFFFF; --panel2:#F8FBF9; --line:#DCE4E0; --line2:#C6D2CC;
  --txt:#0B1A14; --mut:#4C6157; --dim:#7A8B83; --up:#008A4B; --upd:#006E3B; --upg:rgba(0,138,75,.10);
  --dn:#D12A3C; --gold:#A86F00; --goldg:rgba(168,111,0,.10); --onup:#FFFFFF; --ongold:#FFFFFF; --tapebg:#0B1A14; --tabsbg:rgba(255,255,255,.96); --headbg:rgba(243,246,244,.95); --restbg:#E9F7EF;
  --name1:#0B1A14; --name2:#2D4A3D; --ghost:#5B3FD6; --bannertxt:#6B4700; --glow:rgba(0,138,75,.07); --shadow:rgba(20,40,30,.18); color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.45;overflow-x:hidden}
body{background:radial-gradient(1200px 500px at 80% -100px,var(--glow),transparent 60%),var(--bg);min-height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--txt);background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--up)}
a{color:var(--up)}
.mono{font-family:var(--mono)}
.up{color:var(--up)} .dn{color:var(--dn)} .gold{color:var(--gold)} .mut{color:var(--mut)} .dim{color:var(--dim)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(130px + var(--safe-b))}
.hide{display:none!important}

/* ticker */
.tape{position:sticky;top:0;z-index:30;background:var(--tapebg);border-bottom:1px solid var(--line);overflow:hidden;height:30px;display:flex;align-items:center}
.tape-in{display:flex;gap:26px;white-space:nowrap;padding-left:100%;animation:tape 38s linear infinite;font-family:var(--mono);font-size:12px}
.tape-in{color:#C9D6E3}.tape-in span b{font-weight:800;margin-right:6px;color:#fff}.tape .up{color:#00D27A}.tape .dn{color:#FF5468}.tape .mut{color:#8395A7}
@keyframes tape{to{transform:translateX(-100%)}}
.live{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--tapebg);font:800 11px var(--mono);color:#00D27A;z-index:2;box-shadow:8px 0 12px var(--tapebg)}
.live i{width:7px;height:7px;border-radius:50%;background:#00D27A;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

/* hero */
.hero{padding:18px 2px 6px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tick{font:800 13px var(--mono);letter-spacing:.06em;color:var(--mut);display:flex;align-items:center;gap:8px}
.tick .tg{background:var(--upg);color:var(--up);padding:3px 8px;border-radius:6px}
.tier{font:700 11px var(--mono);padding:4px 9px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);letter-spacing:.05em;white-space:nowrap}
.name{font-weight:700;font-size:clamp(46px,15vw,72px);line-height:.92;letter-spacing:-.03em;margin:10px 0 4px;background:linear-gradient(180deg,var(--name1) 0%,var(--name2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.type{font:600 14px var(--mono);color:var(--gold);min-height:21px}
.type::after{content:'▍';animation:blink 1s infinite;margin-left:1px}
.goal{height:6px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-top:10px}.goal i{display:block;height:100%;background:linear-gradient(90deg,var(--upd),var(--up),var(--gold));border-radius:99px}
.themebtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.proj{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#0B1118;border:1px solid var(--line);touch-action:manipulation}
.proj img{display:block;width:100%;height:100%;object-fit:fill}
.proj svg{position:absolute;inset:0;width:100%;height:100%}
.proj .hint{position:absolute;left:8px;right:8px;top:8px;background:rgba(0,0,0,.72);color:#fff;font:700 12.5px var(--mono);padding:8px 10px;border-radius:10px;text-align:center}
.price-card{margin-top:14px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:16px 16px 10px;position:relative;overflow:hidden}
.price-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.price{font:800 clamp(40px,12.5vw,56px) var(--mono);letter-spacing:-.04em;line-height:1}
.price small{font-size:.45em;color:var(--mut);margin-left:4px;letter-spacing:0}
.chg{font:700 14px var(--mono);padding:5px 9px;border-radius:8px;background:var(--upg);color:var(--up);white-space:nowrap}
.ath{font:600 11px var(--mono);color:var(--mut);margin-top:6px;letter-spacing:.04em}
.spark{display:block;width:100%;height:74px;margin-top:8px}
.coachline{font:500 13px var(--mono);color:var(--mut);padding:10px 2px 0;min-height:30px}
.coachline b{color:var(--up)}
.motto{margin:18px 2px 4px;font-size:21px;font-weight:700;letter-spacing:-.01em}
.motto .rot{display:inline-block;color:var(--up);animation:rise .5s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* cards */
.sec{margin-top:18px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px;gap:8px}
.sec-h h2{font-size:13px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative}
.card+.card{margin-top:10px}
.card h3{margin:0 0 4px;font-size:18px;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.kpi .v{font:800 22px var(--mono);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .l{font-size:11px;color:var(--mut);font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--mono);padding:4px 8px;border-radius:999px;background:var(--bg2);border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.pill.g{color:var(--up);border-color:rgba(0,210,122,.4);background:var(--upg)}
.pill.y{color:var(--gold);border-color:rgba(245,184,65,.45);background:var(--goldg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:12px;font-weight:700;font-size:15px;background:var(--panel2);border:1px solid var(--line2);min-height:46px;text-align:center}
.btn.pri{background:var(--up);color:var(--onup);border-color:var(--up)}
.btn.gold{background:var(--gold);color:var(--ongold);border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.sm{padding:8px 11px;min-height:36px;font-size:13px;border-radius:10px}
.btn:active{transform:scale(.98)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.q{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);font:700 11px var(--mono);color:var(--mut);vertical-align:middle;margin-left:4px;flex:none}
.small{font-size:12.5px} .tiny{font-size:11px}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}

/* next session */
.next{border-color:rgba(0,210,122,.35);background:linear-gradient(160deg,rgba(0,210,122,.10),var(--panel) 55%)}
.next .day{font:700 12px var(--mono);color:var(--up);letter-spacing:.1em}
.next h3{font-size:24px;margin:2px 0}
.exlist{margin:10px 0 12px;padding:0;list-style:none;font-size:13.5px;color:var(--mut)}
.exlist li{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
.exlist li:last-child{border:0}
.exlist li b{color:var(--txt);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:4px}
.wd{text-align:center;font:600 10.5px var(--mono);color:var(--dim);padding:7px 0;border-radius:9px;background:var(--bg2);border:1px solid var(--line)}
.wd.tr{color:var(--mut);border-color:var(--line2)}
.wd.done{background:var(--upg);color:var(--up);border-color:rgba(0,210,122,.5)}
.wd.today{outline:2px solid var(--gold);outline-offset:1px}
.wd span{display:block;font-size:14px;margin-top:2px}

/* plan list */
.plan-day{margin-top:10px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}

/* session */
.sess-head{position:sticky;top:30px;z-index:20;background:var(--headbg);backdrop-filter:blur(8px);margin:0 -14px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sess-head .t{font:800 18px var(--mono)}
.mode-banner{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:13px;background:var(--goldg);border:1px solid rgba(245,184,65,.4);color:var(--bannertxt)}
.blk{margin-top:14px}
.blk-tag{font:700 11px var(--mono);color:var(--mut);letter-spacing:.1em;margin:0 2px 6px;display:flex;gap:6px;align-items:center}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.ex.cur{border-color:rgba(0,210,122,.55);box-shadow:0 0 0 1px rgba(0,210,122,.15)}
.ex.fin{opacity:.92;border-color:rgba(0,210,122,.3)}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-n{font-weight:700;font-size:16.5px;line-height:1.2}
.ex-sub{font:500 12px var(--mono);color:var(--mut);margin-top:3px}
.lbl{font:800 12px var(--mono);background:var(--bg2);border:1px solid var(--line2);border-radius:7px;padding:3px 7px;color:var(--mut);flex:none}
.lbl.main{background:var(--up);color:var(--onup);border-color:var(--up)}
.info{margin-top:9px;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.info .ln{display:flex;gap:7px;align-items:flex-start;color:var(--mut)}
.info .ln b{color:var(--txt);font-weight:600}
.info .ln .k{font:700 10.5px var(--mono);color:var(--dim);min-width:62px;padding-top:2px;letter-spacing:.04em}
.sets{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:30px 1fr 16px 1fr 36px;align-items:center;gap:6px}
.set .n{font:700 12px var(--mono);color:var(--dim);text-align:center}
.set input{padding:9px 6px;text-align:center;font-family:var(--mono);font-weight:700;font-size:17px;border-radius:9px;min-width:0}
.set .x{text-align:center;color:var(--dim);font-family:var(--mono)}
.set .ok{width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--dim)}
.set.done input{border-color:rgba(0,210,122,.5);background:rgba(0,210,122,.07)}
.set.done .ok{background:var(--up);border-color:var(--up);color:var(--onup)}
.set.pr .ok{background:var(--gold);border-color:var(--gold)}
.side-h{font:700 10.5px var(--mono);color:var(--mut);margin-top:4px;letter-spacing:.08em}
.unit{font:600 10.5px var(--mono);color:var(--dim);display:grid;grid-template-columns:30px 1fr 16px 1fr 36px;gap:6px;text-align:center}
.rir{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:9px;font-size:12px;color:var(--mut)}
.chip{padding:7px 11px;border-radius:9px;background:var(--bg2);border:1px solid var(--line2);font:700 12.5px var(--mono);color:var(--mut)}
.chip.on{background:var(--up);border-color:var(--up);color:var(--onup)}
.chip.ony{background:var(--gold);border-color:var(--gold);color:var(--ongold)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tools{flex-wrap:nowrap}.tools .btn{flex:1 1 0;min-width:0;padding:8px 4px;font-size:12.5px}
.demo{margin-top:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.demo svg{display:block;width:100%;height:170px}
.note-in{margin-top:8px;min-height:60px;font-size:14px}
.ghost-l{font:600 11.5px var(--mono);color:var(--ghost);background:rgba(150,120,255,.10);border:1px solid rgba(150,120,255,.3);padding:6px 9px;border-radius:9px;margin-top:8px}
.prep{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.prep:last-child{border:0}
.prep .ck{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.prep.done .ck{background:var(--up);border-color:var(--up);color:var(--onup)}
.prep .pn{flex:1;min-width:0}
.prep .pn b{display:block;font-size:14.5px}
.prep .pn span{font-size:12px;color:var(--mut)}

/* rest timer */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-b));z-index:45;width:min(532px,calc(100% - 20px));background:var(--restbg);border:1px solid var(--up);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 40px var(--shadow)}
.rest .tm{font:800 30px var(--mono);color:var(--up);min-width:86px}
.rest .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--up);border-radius:0 0 0 16px;transition:width 1s linear}
.rest .lab{flex:1;font-size:12px;color:var(--mut);min-width:0}
.rest .lab b{display:block;color:var(--txt);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--tabsbg);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + var(--safe-b))}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font:600 10.5px var(--mono);color:var(--dim);letter-spacing:.03em;border-radius:10px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--up)}

/* modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(2,4,7,.78);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px 16px calc(20px + var(--safe-b));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h3{margin:0 0 6px;font-size:21px}
.sheet .x{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;background:var(--bg2);border:1px solid var(--line2);font-size:18px;color:var(--mut)}
.opt{display:grid;gap:8px;margin:10px 0 14px}
.opt.c3{grid-template-columns:repeat(3,1fr)}
.opt.c2{grid-template-columns:repeat(2,1fr)}
.op{padding:12px 6px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);text-align:center;font-weight:600;font-size:13px;line-height:1.25}
.op .e{font-size:24px;display:block;margin-bottom:3px}
.op.on{border-color:var(--up);background:var(--upg);color:var(--up)}
.fl{font:700 11.5px var(--mono);color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}

/* celebration */
.cele{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(2,6,4,.88);animation:fade .2s;padding:20px}
.cele-in{text-align:center;max-width:380px}
.cele .bell{font-size:64px;animation:ring .8s ease 2}
@keyframes ring{20%{transform:rotate(18deg)}40%{transform:rotate(-16deg)}60%{transform:rotate(10deg)}80%{transform:rotate(-6deg)}}
.cele h2{font:800 28px var(--mono);color:var(--up);margin:10px 0 4px;letter-spacing:-.02em}
.cele p{color:var(--txt);font-size:16px;margin:6px 0}
.candles{display:flex;gap:6px;justify-content:center;align-items:flex-end;height:90px;margin:16px 0}
.candles i{width:12px;background:var(--up);border-radius:2px;position:relative;animation:grow .6s ease backwards}
.candles i::before{content:'';position:absolute;left:5px;width:2px;top:-10px;bottom:-8px;background:var(--up);opacity:.6}
@keyframes grow{from{height:0!important}}

/* done screen */
.done-big{font:800 46px var(--mono);letter-spacing:-.04em}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stars{display:flex;gap:6px;justify-content:center;margin:8px 0;font-size:30px}
.stars button{color:var(--line2)} .stars button.on{color:var(--gold)}

/* lists */
.hold{display:grid;grid-template-columns:54px 1fr 64px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hold:last-child{border:0}
.hold .tk{font:800 13px var(--mono)}
.hold .nm{font-size:12px;color:var(--mut);margin-top:1px}
.hbar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}

.hold .pc{font:800 14px var(--mono);text-align:right}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font:700 10.5px var(--mono);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .mono{white-space:nowrap}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;min-width:0}
.bd .i{font-size:26px;filter:grayscale(1);opacity:.35}
.bd .t{font-size:11.5px;font-weight:700;margin-top:4px;line-height:1.2}
.bd .d{font-size:10px;color:var(--dim);margin-top:2px;line-height:1.25}
.bd.on{border-color:rgba(245,184,65,.5);background:var(--goldg)}
.bd.on .i{filter:none;opacity:1}
.weeks{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.wk{aspect-ratio:1;border-radius:10px;background:var(--bg2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 11px var(--mono);color:var(--dim)}
.wk b{font-size:15px}
.wk.on{background:var(--upg);border-color:rgba(0,210,122,.5);color:var(--up)}
.wk.now{outline:2px solid var(--gold);outline-offset:1px}
.athl{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.athl:last-child{border:0}

.dots{display:flex;gap:8px}
.dot{width:52px;height:52px;border-radius:14px;background:var(--bg2);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 10px var(--mono);color:var(--dim)}
.dot b{font-size:15px}
.dot.on{background:var(--upg);border-color:var(--up);color:var(--up)}
.meter{height:12px;border-radius:99px;background:linear-gradient(90deg,var(--up) 0 45%,var(--gold) 45% 75%,var(--dn) 75%);position:relative;margin:16px 4px 6px}
.meter i{position:absolute;top:-6px;width:4px;height:24px;background:#fff;border-radius:3px;box-shadow:0 0 0 3px rgba(0,0,0,.5);transition:left .6s}
.meal{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.meal:last-child{border:0}
.meal svg{width:78px;height:78px}
.meal b{font-size:14px}
.meal .g{font-size:12.5px;color:var(--mut);margin-top:3px}
.tabsel{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabsel::-webkit-scrollbar{display:none}
.tabsel .chip{flex:none}

/* before after */
.ba{position:relative;width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--bg2);border:1px solid var(--line)}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .clip{position:absolute;inset:0;overflow:hidden}
.ba .hd{position:absolute;top:0;bottom:0;width:3px;background:var(--up);box-shadow:0 0 10px var(--up)}
.ba .tg{position:absolute;top:10px;font:800 11px var(--mono);background:rgba(0,0,0,.6);padding:4px 8px;border-radius:6px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{aspect-ratio:3/4;border-radius:12px;border:1px dashed var(--line2);background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 11px var(--mono);color:var(--mut);overflow:hidden;position:relative;text-align:center;padding:4px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot span{position:relative;background:rgba(0,0,0,.55);padding:3px 6px;border-radius:6px}

.wa{position:fixed;right:14px;bottom:calc(80px + var(--safe-b));z-index:35;width:50px;height:50px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.wa svg{width:28px;height:28px}
.toast{position:fixed;left:50%;top:44px;transform:translateX(-50%);z-index:90;background:var(--panel2);border:1px solid var(--line2);padding:10px 14px;border-radius:12px;font-size:13.5px;max-width:calc(100% - 28px);box-shadow:0 10px 30px var(--shadow);animation:fade .2s}
.foot{text-align:center;font:600 11px var(--mono);color:var(--dim);margin-top:26px;letter-spacing:.08em}
.scout{margin-top:12px;border-left:3px solid var(--gold);background:var(--goldg);padding:10px 12px;border-radius:0 12px 12px 0;font-size:13px}
.scout b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--gold);display:block;margin-bottom:3px}
.split-glow .price-card{border-color:rgba(245,184,65,.55);box-shadow:0 0 0 1px rgba(245,184,65,.2),0 10px 40px rgba(245,184,65,.08)}
svg text{font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.tape-in{padding-left:0}}

/* ================= training math ================= */
const PCT = {1:100,2:95,3:93,4:90,5:87,6:85,7:83,8:80,9:77,10:75,11:72,12:67,13:65,14:63,15:61};
const pctFor = r=>r<=0?100:(r<=15?PCT[Math.round(r)]:Math.max(40,61-(r-15)*1.6));
function bwNow(){const a=avg7();return a||S.profile.startWeight}
function loadOf(exId,w){const e=EX[exId];if(!e)return w;if(exId==='apu')return Math.max(5,bwNow()-(w||0));if(e.u==='bw')return bwNow()*0.6+(w||0);if(e.u==='h'||e.u==='s')return (w||0)*2;return w||0}
function e1(exId,w,r,rir=0){if(!r)return 0;return loadOf(exId,w)/(pctFor(r+rir)/100)}
const doneSessions = ()=>S.sessions.filter(s=>s.end).sort((a,b)=>a.start-b.start);
function setsOf(sess,exId){const x=sess.log&&sess.log[exId];return x?x.sets.filter(s=>s.done&&s.r>0):[]}
function exHistory(exId){return doneSessions().filter(s=>setsOf(s,exId).length).map(s=>({s,sets:setsOf(s,exId),rir:s.log[exId].rir}))}
function bestE1(exId,beforeTs=Infinity){let b=0;for(const h of exHistory(exId)){if(h.s.start>=beforeTs)continue;for(const st of h.sets)b=Math.max(b,e1(exId,st.w,st.r))}return b}
function baseE1(exId){const e=EX[exId];if(e.st.real)return e1(exId,e.st.w,e.st.r);const h=exHistory(exId)[0];if(!h)return 0;return Math.max(...h.sets.map(st=>e1(exId,st.w,st.r)))}
function strengthPct(exId){const b=baseE1(exId);if(!b)return null;const best=Math.max(bestE1(exId),b);return best/b-1}
function lastPerf(exId){const h=exHistory(exId);return h.length?h[h.length-1]:null}
function topSet(sets,exId){return sets.reduce((a,s)=>!a||e1(exId,s.w,s.r)>e1(exId,a.w,a.r)?s:a,null)}
function roundTo(w,step){if(!step)return w;const s=Math.abs(step);return Math.round(w/s)*s}

/* week / block */
function progStart(){const d=doneSessions();const first=d[0]?new Date(d[0].start):(S.active?new Date(S.active.start):new Date());return weekStart(first)}
function weekNo(date=new Date()){return Math.floor((weekStart(date)-progStart())/(7*864e5)+0.01)+1}
function blockInfo(date=new Date()){const w=Math.max(1,weekNo(date));const q=Math.ceil(w/6);const bw=((w-1)%6)+1;return {w,q,bw,deload:bw===6,earn:bw===6,phase:bw<=2?'Learn the weights':bw<=5?'Build: +1 set on the main lift':'Deload + Earnings Day'}}
function weekMap(){const m={};for(const s of doneSessions()){if(s.day==='H'&&false)continue;const k=dstr(weekStart(new Date(s.start)));(m[k]=m[k]||[]).push(s)}return m}
function weeksCounted(){return Object.values(weekMap()).filter(a=>a.length>=2).length}

/* planned sets/reps for a block item given mode */
function planned(item,isMain,mode,bi){let sets=item.sets;if(isMain&&bi.bw>=3&&bi.bw<=5&&mode==='full')sets+=1;if(bi.deload)sets=Math.max(2,sets-1);
  if(mode==='express')sets=Math.min(sets,2);if(mode==='flash')sets=Math.min(sets,3);return {sets,r:item.r}}

/* suggestion engine (double progression) */
function suggest(exId,item,ctx){const e=EX[exId];const lp=lastPerf(exId);const [lo,hi]=item.r;
  if(!lp){if(e.st.real)return {w:e.st.w,txt:`Starting line ${fmt(e.st.w)} × ${e.st.r}. Beat it for your first ATH.`,kind:'start'};
    return {w:e.st.w,txt:`Est. start ${fmt(e.st.w)} ${unitLbl(e.u)}. Find a weight you can do for ${lo}–${hi} with 2 reps left.`,kind:'est'}}
  const ts=topSet(lp.sets,exId);const w=ts.w;const allTop=lp.sets.every(s=>s.r>=hi);const anyLow=lp.sets.some(s=>s.r<lo);
  const easy=(lp.rir??0)>=3;
  if(ctx.deload)return {w,txt:`Deload week: ${fmt(w)} ${unitLbl(e.u)}, stop at 3 reps in reserve.`,kind:'deload'};
  if(e.u==='bw'&&!w){if(allTop||easy)return {w:0,txt:`You owned ${hi} reps. Slower reps or add a little weight.`,kind:'up'};return {w:0,txt:`Chase +1 rep per set vs last time.`,kind:'hold'}}
  if((allTop||easy)&&ctx.full&&e.inc){const nw=Math.max(0,roundTo(w+e.inc,e.inc));return {w:nw,txt:`You earned it: ${fmt(nw)} ${unitLbl(e.u)} today (${exId==='apu'?'less assist':'+'+fmt(Math.abs(e.inc))}).`,kind:'up'}}
  const h=exHistory(exId);const prev=h.length>1?h[h.length-2]:null;
  if(anyLow&&prev&&prev.sets.some(s=>s.r<lo)&&topSet(prev.sets,exId).w===w){const nw=roundTo(w*(exId==='apu'?1.1:0.9),e.inc||1);return {w:nw,txt:`Two tough sessions in a row: reset to ${fmt(nw)} and build back up.`,kind:'reset'}}
  return {w,txt:`Hold ${fmt(w)}. Goal: +1 rep on any set (top of range = ${hi}).`,kind:'hold'}}

/* smart pick */
function smartPick(exId,item,w){const lp=lastPerf(exId);const e=EX[exId];let est;
  if(lp){const ts=topSet(lp.sets,exId);est=e1(exId,ts.w,ts.r,lp.rir??2)}else if(e.st)est=e1(exId,e.st.w,e.st.r,2);else return null;
  if(!est)return null;const ld=loadOf(exId,w);let reps=0;for(let r=1;r<=30;r++){if(est*pctFor(r+2)/100>=ld)reps=r}
  const max=e.u==='bw'?null:(exId==='apu'?null:est/(e.u==='h'||e.u==='s'?2:1));
  return {max,reps}}

/* ================= body / fuel ================= */
function sortedW(){return [...S.weights].sort((a,b)=>a.d<b.d?-1:1)}
function avg7(endDate=new Date()){const e=dstr(endDate),s=dstr(addDays(endDate,-6));const a=S.weights.filter(w=>w.d>=s&&w.d<=e);if(!a.length){const p=sortedW().filter(w=>w.d<=e);return p.length?p[p.length-1].kg:null}return a.reduce((t,w)=>t+w.kg,0)/a.length}
function latestM(k){const a=[...S.measures].filter(m=>m[k]!=null).sort((a,b)=>a.d<b.d?-1:1);return a.length?a[a.length-1][k]:null}
function firstM(k){const a=[...S.measures].filter(m=>m[k]!=null).sort((a,b)=>a.d<b.d?-1:1);return a.length?a[0][k]:null}
function targets(){const p=S.profile;const w=avg7()||p.startWeight;const bmr=10*w+6.25*p.height-5*p.age+5;const maint=bmr*p.act;const kcal=Math.round((maint+250+S.kcalAdj)/10)*10;
  const pro=Math.round(w*2/5)*5;const fat=Math.round(w*0.9);const carb=Math.max(150,Math.round((kcal-pro*4-fat*9)/4));return {bmr:Math.round(bmr),maint:Math.round(maint),kcal,pro,fat,carb,w}}
function navyBF(){const w=latestM('waist'),n=latestM('neck');if(!w||!n||w<=n)return null;const i=2.54;return 86.010*Math.log10(w/i-n/i)-70.041*Math.log10(S.profile.height/i)+36.76}
function fuelDay(d=dstr()){return S.fuel[d]=S.fuel[d]||{p:0,sh:0,cr:false,ex:0}}

/* Fed decision */
function fedDecision(){const now=new Date();const a1=avg7(now),a0=avg7(addDays(now,-7));const wts=S.weights;
  if(wts.length<4||!a1||!a0)return {need:true,txt:'Log your weight 4+ mornings this week. The Fed needs data.'};
  const first=sortedW()[0];if((now-pdate(first.d))/864e5<10)return {need:true,txt:'Collecting 2 weeks of data before the first decision.'};
  const pct=(a1-a0)/a0*100;const w1=latestM('waist'),w0=firstM('waist');const gain=a1-S.profile.startWeight;const waistUp=(w1!=null&&w0!=null)?w1-w0:null;
  let d=0,lab='HOLD',why='';
  if(waistUp!=null&&waistUp>0.6+0.6*Math.max(0,gain)){d=-150;lab='CUT 150';why=`Waist +${fmt(waistUp)} cm is rising faster than weight. Overheating.`}
  else if(pct>0.65){d=-150;lab='CUT 150';why=`+${fmt(pct,2)}%/week is too fast (target 0.25–0.5%).`}
  else if(pct<0.1){d=+150;lab='RAISE 150';why=`${pct>=0?'+':''}${fmt(pct,2)}%/week is too slow. Time to add fuel.`}
  else {why=`${pct>=0?'+':''}${fmt(pct,2)}%/week. Right in the target corridor.`}
  return {pct,d,lab,why,wk:dstr(weekStart(now))}}

/* ================= price engine ================= */
function planExIds(){const ids=new Set();for(const k of ROT)for(const b of PLAN[k].blocks)for(const it of b.items)ids.add(S.swaps[it.ex]||it.ex);return [...ids]}
function priceParts(){const ds=doneSessions();const ids=planExIds();const pcts=ids.filter(id=>EX[id].u!=='bw'&&(EX[id].st.real?exHistory(id).length>=1:exHistory(id).length>=2)).map(strengthPct).filter(v=>v!=null).map(v=>Math.max(0,v));
  const sp=pcts.length?pcts.reduce((a,b)=>a+b,0)/pcts.length:0;
  const strength=sp*200, sess=ds.length*1.2, weeks=weeksCounted()*3, prs=Math.min(60,(S.prs||[]).length*1.5);
  const a=avg7();let lean=0;if(a){const gain=Math.min(3,Math.max(0,a-S.profile.startWeight));const w1=latestM('waist'),w0=firstM('waist');let f=1;if(w1!=null&&w0!=null&&(w1-w0)>0.5+0.6*gain)f=0.4;lean=gain*8*f}
  return {strength,sess,weeks,prs,lean,sp}}
function priceNow(){return priceParts().sp*100}
function updatePrice(){const v=priceNow();const today=dstr();const old=S.price.ath;if(v>S.price.ath)S.price.ath=v;S.price.hist[today]=Math.max(S.price.hist[today]||0,S.price.ath);save();return {old,now:S.price.ath}}

function checkBadges(){const ds=doneSessions();const got=[];const give=id=>{if(!S.badges[id]){S.badges[id]=Date.now();got.push(id)}};
  if(ds.length>=1)give('ipo');if((S.prs||[]).length>=1)give('ath1');if((S.prs||[]).length>=10)give('ath10');
  if(Object.values(weekMap()).some(a=>a.length>=3))give('week');if(weeksCounted()>=4)give('w4');if(ds.length>=10)give('s10');if(ds.length>=25)give('s25');
  if(S.price.ath>=10)give('p150');if(S.price.ath>=25)give('split');if(ds.some(s=>s.sent==='bear'))give('bear');if(ds.some(s=>s.day==='H'))give('hotel');
  const a=avg7();const w1=latestM('waist'),w0=firstM('waist');if(a&&a-S.profile.startWeight>=1&&w1!=null&&w0!=null&&w1-w0<=1)give('lean');
  let streak=0;for(let i=0;i<60;i++){const f=S.fuel[dstr(addDays(new Date(),-i))];if(f&&f.p>=4)streak++;else if(i>0)break;else continue;if(streak>=7){give('fuel7');break}}

async function encodeData(obj){const json=new TextEncoder().encode(JSON.stringify(obj));

  return 'j'+b64u.enc(json)}
async function decodeData(code){code=code.trim();const t=code[0],body=code.slice(1);const u=b64u.dec(body);
  if(t==='z'){const ds=new DecompressionStream('deflate-raw');const st=new Blob([u]).stream().pipeThrough(ds);return JSON.parse(await new Response(st).text())}
  return JSON.parse(new TextDecoder().decode(u))}

  const byD=(a,b)=>{const m={};for(const x of [...a,...b]){if(!x||!x.d)continue;if(!m[x.d]||(x.t||0)>(m[x.d].t||0))m[x.d]=x}return Object.values(m)};
  S.weights=byD(S.weights,o.weights||[]);S.measures=byD(S.measures,o.measures||[]);
  for(const [d,f] of Object.entries(o.fuel||{})){const m=fuelDay(d);m.p=Math.max(m.p,f.p||0);m.sh=Math.max(m.sh,f.sh||0);m.cr=m.cr||!!f.cr;m.ex=Math.max(m.ex,f.ex||0)}

  for(const [k,v] of Object.entries(o.badges||{}))if(!S.badges[k]||v<S.badges[k])S.badges[k]=v;
  const prk=new Set((S.prs||[]).map(p=>p.id));for(const p of (o.prs||[]))if(p&&!prk.has(p.id)){S.prs.push(p);prk.add(p.id)}
  const fk=new Set(S.fed.map(f=>f.wk));for(const f of (o.fed||[]))if(!fk.has(f.wk)){S.fed.push(f);fk.add(f.wk)}

  if(A.caution)m.push('🛡️ Conservative day: stop at 2–3 reps in reserve, no weight jumps.');if(A.deload)m.push('🧘 Deload week: 1 set less, 3 reps in reserve. Recovery = growth.');if(A.earn)m.push('📊 Earnings Day: last set of the main lift = AMRAP, stop 1 rep before failure.');

  h+=`<details class="card sec" ${pd<prep.length&&!countDone(A)?'open':''}><summary><div class="between"><div><div class="mono tiny mut">PRE-MARKET · ${A.mode==='full'?'5':'3'} MIN</div><div style="font-weight:700">Warm-up ${pd}/${prep.length}</div></div><span class="mut">▾</span></div></summary>${prep.map(p=>prepRow(p,A.prep[p.id],'prep')).join('')}</details>`;
  sessBlocks(A).forEach((b,bx)=>{const L=String.fromCharCode(65+bx);h+=`<div class="blk"><div class="blk-tag">${b.items.length>1?'SUPERSET '+L+' · NO REST BETWEEN '+L+'1 AND '+L+'2':'BLOCK '+L}${b.main?' · <span class="up">MAIN LIFT</span>':''}</div>`;
    b.items.forEach((it,j)=>{h+=exCard(A,b,it,L+(b.items.length>1?(j+1):''),bi)});h+='</div>'});
  h+=`<details class="card sec"><summary><div class="between"><div><div class="mono tiny mut">AFTER-HOURS · 3 MIN</div><div style="font-weight:700">Cool-down ${COOL.filter(p=>A.cool[p.id]).length}/${COOL.length}</div></div><span class="mut">▾</span></div></summary>${COOL.map(p=>prepRow(p,A.cool[p.id],'cool')).join('')}</details>
  <button class="btn pri wide" style="margin-top:16px;min-height:56px;font-size:17px" data-act="finish">🏁 Close the market · Finish</button>
  <button class="btn ghost wide sm" style="margin-top:8px" data-act="cancelSess">Cancel session</button>`;return h}
function prepRow(p,done,kind){return `<div class="prep ${done?'done':''}"><button class="ck" data-act="prepck" data-k="${kind}" data-id="${p.id}">${done?'✓':''}</button><div class="pn"><b>${esc(p.n)}</b><span>${esc(p.d)}</span></div><button class="btn sm ghost" data-act="demo" data-pat="${p.pat}" data-n="${esc(p.n)}" data-yt="${esc(p.yt)}" aria-label="Demo">▶</button></div>`}

function ghostLine(A,exId){if(A.wk<=6)return '';const target=A.wk-6;const ses=doneSessions().find(s=>s.wk===target&&s.day===A.day&&setsOf(s,exId).length);if(!ses)return '';const st=setsOf(ses,exId);return `<div class="ghost-l">👻 Q1 you, week ${target}: ${st.map(s=>fmt(s.w)+'×'+s.r).join(', ')}. Beat him.</div>`}
function exCard(A,b,it,L,bi){const id=S.swaps[it.ex]||it.ex;const e=EX[id];const pl=planned(it,b.main,A.mode==='hotel'?'full':A.mode,{...blockInfo(new Date(A.start)),deload:A.deload});const log=exLog(A,id);
  const ctx={deload:A.deload,full:A.mode==='full'&&!A.caution};const sg=suggest(id,it,ctx);const lp=lastPerf(id);const uni=!!e.uni;
  // build rows
  const rows=uni?pl.sets*2:pl.sets;while(log.sets.length<rows)log.sets.push({w:null,r:null,done:false,side:uni?(log.sets.length%2?'R':'L'):null});
  const lastSets=lp?lp.sets:[];const wDefault=sg.w;
  let rowsH='';for(let i=0;i<rows;i++){const s=log.sets[i];const si=uni?Math.floor(i/2):i;if(uni&&i%2===0)rowsH+=`<div class="side-h">SET ${si+1}</div>`;
    const lastR=(lastSets[i]&&lastSets[i].r)||it.r[1];const prevW=i>0?log.sets[i-1].w:null;const wv=s.w!=null?s.w:(prevW!=null?prevW:wDefault);
    rowsH+=`<div class="set ${s.done?'done':''} ${s.pr?'pr':''}" data-ex="${id}" data-i="${i}"><span class="n">${uni?s.side:(si+1)}</span><input inputmode="decimal" class="sw" value="${wv!=null?fmt(wv,2):''}" aria-label="weight" data-act2="w"><span class="x">×</span><input inputmode="numeric" class="sr" value="${s.r!=null?s.r:''}" placeholder="${lastR}" aria-label="reps" data-act2="r" enterkeyhint="next"><button class="ok" data-act="setok">${s.done?(s.pr?'★':'✓'):''}</button></div>`}
  const isLastSetMain=b.main&&A.earn;
  const sp=smartPick(id,it,wDefault);
  const stLine=e.st.real?`<b>${fmt(e.st.w)} × ${e.st.r}</b> <span class="up">✓ your real numbers</span>`:`<b>${e.u==='bw'?'BW':fmt(e.st.w)} × ${e.st.r}</b> <span class="gold">Est.</span> until you log it`;
  const fin=log.sets.length&&log.sets.every(s=>s.done);
  return `<div class="ex ${fin?'fin':''}" id="ex_${id}" data-ex="${id}" data-blk="${b.idx}" data-item="${b.items.indexOf(it)}"><div class="ex-h"><div style="min-width:0"><div class="ex-n">${esc(e.n)}</div><div class="ex-sub">${pl.sets} × ${it.r[0]}–${it.r[1]}${e.secs?' s':''} · rest ${Math.floor(restFor(A,b)/60)}:${pad2(restFor(A,b)%60)} · ${unitLbl(e.u)}${uni?' · L first':''}</div></div><span class="lbl ${b.main?'main':''}">${L}</span></div>
   <div class="info">
    ${lp?`<div class="ln"><span class="k">LAST</span><span><b>${lp.sets.map(s=>(uni?s.side:'')+fmt(s.w)+'×'+s.r).join(', ')}</b>${lp.rir!=null?' · RIR '+lp.rir:''}</span></div>`:`<div class="ln"><span class="k">START</span><span>${stLine}</span></div>`}
    <div class="ln"><span class="k">TODAY</span><span class="${sg.kind==='up'?'up':''}">${esc(sg.txt)} ${why('dp')}</span></div>
    ${sp&&sp.reps&&e.u!=='bw'?`<div class="ln"><span class="k">SMART</span><span>${sp.max?`Est. max <b>${fmt(sp.max,1)}</b> · `:''}at ${fmt(wDefault)} → ~<b>${sp.reps}</b> reps @2 RIR ${why('smart')}</span></div>`:''}
    ${isLastSetMain?`<div class="ln"><span class="k">EARNINGS</span><span class="gold">Last set: AMRAP, stop 1 rep before failure.</span></div>`:''}
   </div>${ghostLine(A,id)}
   <div class="unit"><span>${uni?'':'SET'}</span><span>${unitLbl(e.u).toUpperCase()}</span><span></span><span>${e.secs?'SECONDS':'REPS'}</span><span></span></div>
   <div class="sets">${rowsH}</div>
   <div class="rir">Reps left on last set:${[0,1,2,3,4].map(v=>`<button class="chip ${log.rir===v?'on':''}" data-act="rir" data-ex="${id}" data-v="${v}">${v===4?'4+':v}</button>`).join('')}</div>
   <div class="tools"><button class="btn sm" data-act="exdemo" data-ex="${id}">▶ Demo</button><button class="btn sm" data-act="swap" data-ex="${it.ex}">⇄ Swap</button><a class="btn sm" href="${yt(e.yt)}" target="_blank" rel="noopener">🎬 Video</a><button class="btn sm" data-act="exnote" data-ex="${id}">💬${log.note?' ✓':''}</button><button class="btn sm" data-act="muscles" data-ex="${id}">🎯</button></div>
   <div class="demo hide" id="demo_${id}"><div class="small mut" style="padding:8px 10px 0">${esc(e.cue)}</div>${figMarkup(e.pat)}</div>
   <textarea class="note-in hide" id="note_${id}" placeholder="Note for Coach Ibrahim (sent on WhatsApp)" data-act2="note" data-ex="${id}">${esc(log.note)}</textarea></div>`}

document.addEventListener('change',e=>{const t=e.target;const row=t.closest('.set');if(!row||!S.active)return;const ex=row.dataset.ex,i=+row.dataset.i;const l=exLog(S.active,ex);const s=l.sets[i];
  if(t.dataset.act2==='w'){s.w=num(t.value);for(let k=i+1;k<l.sets.length;k++){if(l.sets[k].done)break;const inp=$(`.set[data-ex="${ex}"][data-i="${k}"] .sw`);if(inp&&(EX[ex].uni?true:true)){inp.value=t.value;l.sets[k].w=s.w}}save()}
  if(t.dataset.act2==='r'){const r=num(t.value);s.r=r;if(r>0&&!s.done){completeSet(ex,i)}else save()}});

ACT.setok=el=>{const row=el.closest('.set');const ex=row.dataset.ex,i=+row.dataset.i;const l=exLog(S.active,ex);const s=l.sets[i];
  if(s.done){s.done=false;s.pr=false;row.classList.remove('done','pr');el.textContent='';save();return}
  const wi=$('.sw',row),ri=$('.sr',row);s.w=num(wi.value);if(s.w==null){s.w=0;wi.value='0'}s.r=num(ri.value)||num(ri.placeholder);ri.value=s.r;completeSet(ex,i)};
function completeSet(ex,i){const A=S.active;const l=exLog(A,ex);const s=l.sets[i];const row=$(`.set[data-ex="${ex}"][data-i="${i}"]`);if(s.w==null){const wi=row&&$('.sw',row);s.w=wi?num(wi.value)||0:0}
  s.done=true;s.t=Date.now();
  // PR check
  const e=EX[ex];const val=e1(ex,s.w,s.r);let prior=bestE1(ex,A.start);if(e.st.real)prior=Math.max(prior,e1(ex,e.st.w,e.st.r));const hasBase=prior>0;
  for(const [k,x] of l.sets.entries())if(k!==i&&x.done)prior=Math.max(prior,e1(ex,x.w,x.r));
  if(hasBase&&val>prior*1.0005&&!(e.u==='bw'&&false)){s.pr=true;const prev=prevBestTxt(ex,A.start);A.prs=A.prs.filter(p=>p.ex!==ex);A.prs.push({id:A.id+'_'+ex,ex,w:s.w,r:s.r,d:dstr(),prev});celebratePR(ex,s,prev)}
  save();if(row){row.classList.add('done');row.classList.toggle('pr',!!s.pr);$('.ok',row).textContent=s.pr?'★':'✓'}
  const card=$('#ex_'+ex);if(card&&l.sets.every(x=>x.done))card.classList.add('fin');
  // next focus / rest
  const D=PLAN[A.day];const bix=+card.dataset.blk,itx=+card.dataset.item;const b=D.blocks[bix];const setIdx=e.uni?Math.floor(i/2):i;
  if(e.uni&&i%2===0){focusRow(ex,i+1);return}
  if(b.items.length>1&&itx<b.items.length-1){const pid=S.swaps[b.items[itx+1].ex]||b.items[itx+1].ex;const pl=exLog(A,pid);const pIdx=EX[pid].uni?setIdx*2:setIdx;if(pl.sets[pIdx]&&!pl.sets[pIdx].done){focusRow(pid,pIdx);return}}
  const rest=restFor(A,b);const firstId=S.swaps[b.items[0].ex]||b.items[0].ex;const fl=exLog(A,firstId);const nIdx=fl.sets.findIndex(x=>!x.done);
  if(nIdx>=0){restStart(rest,`Next: ${EX[firstId].n} · set ${(EX[firstId].uni?Math.floor(nIdx/2):nIdx)+1}`,()=>focusRow(firstId,nIdx,true))}
  else{const bl=sessBlocks(A);const pos=bl.findIndex(x=>x.idx===bix);const nb=bl[pos+1];if(nb){const nid=S.swaps[nb.items[0].ex]||nb.items[0].ex;restStart(rest,`Next: ${EX[nid].n}`,()=>focusRow(nid,0,true))}else{restStart(60,'Last set done. Cool-down, then Finish 🏁')}}}
function focusRow(ex,i,scroll){const inp=$(`.set[data-ex="${ex}"][data-i="${i}"] .sr`);if(!inp)return;$$('.ex.cur').forEach(x=>x.classList.remove('cur'));const c=$('#ex_'+ex);c&&c.classList.add('cur');if(scroll)inp.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'});try{inp.focus({preventScroll:!scroll})}catch(e){inp.focus()}}
function prevBestTxt(ex,before){let b=null,bv=0;for(const h of exHistory(ex)){if(h.s.start>=before)continue;for(const s of h.sets){const v=e1(ex,s.w,s.r);if(v>bv){bv=v;b=s}}}const e=EX[ex];if(e.st.real&&e1(ex,e.st.w,e.st.r)>=bv)b={w:e.st.w,r:e.st.r};return b?`${fmt(b.w)} × ${b.r}`:''}
function celebratePR(ex,s,prev){vib([60,40,120]);beep(1046,180);setTimeout(()=>beep(1318,240),170);const c=document.createElement('div');c.className='cele';c.setAttribute('data-act','closeCele');
  c.innerHTML=`<div class="cele-in"><div class="bell">🔔</div><h2>NEW ALL-TIME HIGH</h2><p><b>${esc(EX[ex].n)}</b></p><p class="mono" style="font-size:24px;font-weight:800">${fmt(s.w)} × ${s.r}</p>${prev?`<p class="mut small">Previous high: ${esc(prev)}</p>`:''}<div class="candles">${[22,30,26,40,48,44,62,80].map((h,i)=>`<i style="height:${h}px;animation-delay:${i*60}ms"></i>`).join('')}</div><p class="small mut">Tap to keep trading</p></div>`;document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}

let REST=null;
function restStart(sec,label,after){restStop();REST={end:Date.now()+sec*1000,total:sec,label,after};restDraw();REST.iv=setInterval(restDraw,250)}
function restDraw(){if(!REST)return;const left=Math.max(0,Math.round((REST.end-Date.now())/1000));const box=$('#restBox');
  box.innerHTML=`<div class="rest"><div class="tm">${left>0?Math.floor(left/60)+':'+pad2(left%60):'GO'}</div><div class="lab"><b>${left>0?'Rest':'Next set!'}</b>${esc(REST.label)}</div><button class="btn sm" data-act="rest15">+15</button><button class="btn sm pri" data-act="restSkip">${left>0?'Skip':'OK'}</button><div class="bar" style="width:${(1-left/REST.total)*100}%"></div></div>`;
  if(left<=0&&!REST.rang){REST.rang=true;vib([300,120,300]);beep(880,250);setTimeout(()=>beep(1175,300),280);const f=REST.after;REST.after=null;f&&f();setTimeout(()=>{if(REST&&REST.rang)restStop()},4000)}}
function restStop(){if(REST){clearInterval(REST.iv)}REST=null;const b=$('#restBox');if(b)b.innerHTML=''}
ACT.rest15=()=>{if(REST){REST.end+=15000;REST.total+=15;REST.rang=false;restDraw()}};

function startSessTimer(){const A=S.active;if(!A)return;const tick=()=>{const el=$('#sessT');if(!el||!S.active){clearInterval(sessTimer);return}const s=Math.floor((Date.now()-A.start)/1000);el.textContent=(s>=3600?Math.floor(s/3600)+':':'')+pad2(Math.floor(s/60)%60)+':'+pad2(s%60)};tick();sessTimer=setInterval(tick,1000)}

HREF.sync=async()=>waLink(`$ISML · Data sync from ${S.profile.name}\nSessions: ${doneSessions().length} · Stock: ${pc(S.price.ath)}\n\n🔄 Tap to add to your phone: `+await syncLink());
HREF.repDay=async()=>waLink(report(1)+'\n\n🔄 Sync: '+await syncLink());
HREF.repWeek=async()=>waLink(report(7)+'\n\n🔄 Sync: '+await syncLink());
HREF.repMonth=async()=>waLink(report(30)+'\n\n🔄 Sync: '+await syncLink());
function report(days){const now=new Date();const from=days===7?weekStart(now):addDays(now,-(days-1));from.setHours(0,0,0,0);const ss=doneSessions().filter(s=>s.start>=from.getTime());
  const lab=days===1?'Today':days===7?'This week':'Last 30 days';const prs=ss.flatMap(s=>s.prs||[]);let pm=0,sh=0,cr=0,n=0,st=0,sn=0;
  for(let d=new Date(from);d<=now;d=addDays(d,1)){const k=dstr(d);n++;const f=S.fuel[k];if(f){pm+=f.p;sh+=f.sh;cr+=f.cr?1:0}if(S.steps[k]){st+=S.steps[k];sn++}}
  let t=`$ISML · ${lab} report (${fmtD(from)} – ${fmtD(now)})\n📈 $ISML: ${pc(S.price.ath)} stronger than day 1 (target +20%)\n🏋️ Sessions: ${ss.length}${ss.length?' · '+ss.map(s=>PLAN[s.day].name+(s.mode!=='full'?' ('+s.mode+')':'')).join(', '):''}\n`;
  if(ss.length)t+=`🧠 Sentiment: ${ss.map(s=>SENT[s.sent]||'–').join(' / ')} · Felt: ${ss.map(s=>s.feel||'–').join(' / ')}\n`;
  t+=`🔔 ATHs: ${prs.length?prs.map(p=>EX[p.ex].n+' '+fmt(p.w)+'×'+p.r).join(' · '):'–'}\n`;
  const a=avg7();const w1=latestM('waist'),w0=firstM('waist');t+=`⚖️ Weight 7-day avg: ${a?fmt(a,1)+' kg ('+(a-S.profile.startWeight>=0?'+':'')+fmt(a-S.profile.startWeight,1)+')':'–'} · Waist: ${w1?fmt(w1,1)+' cm'+(w0?' ('+(w1-w0>=0?'+':'')+fmt(w1-w0,1)+')':''):'–'}\n`;
  t+=`🥩 Protein meals: ${fmt(pm/n,1)}/day · 🥤 Shakes: ${sh} · 💊 Creatine: ${cr}/${n} days${sn?' · 👟 Steps avg: '+Math.round(st/sn).toLocaleString():''}\n`;
  const fd=fedDecision();t+=`📣 Fed: ${fd.need?'collecting data':fd.lab+' ('+fd.why+')'} · Target ${targets().kcal} kcal`;
  if(coach.on)t+='\n\n'+radar();return t}
function radar(){const ds=doneSessions();const last=ds[ds.length-1];const since=last?Math.floor((Date.now()-last.end)/864e5):null;const ws=weekStart(new Date());const wk=[0,1,2,3].map(i=>weekStats(addDays(ws,-7*i)).n);
  const bears=ds.slice(-6).filter(s=>s.sent==='bear').length;const hard=ds.slice(-6).filter(s=>s.feel==='hard').length;
  return `🛰️ CONSISTENCY RADAR (coach)\nSessions last 4 wks: ${wk.reverse().join(' · ')}\nDays since last session: ${since??'–'}\nBearish check-ins (last 6): ${bears} · Felt hard: ${hard}\nFlags: ${[since>4?'⚠️ gap > 4 days':'',bears>=3?'⚠️ low mood trend':'',hard>=3?'⚠️ check recovery':''].filter(Boolean).join(' ')||'none'}`}
function vMore(){const p=S.profile;const lm=k=>latestM(k);
  let h=`<div class="hero" style="padding-bottom:0"><div class="tick"><span class="tg">MORE</span>SETTINGS · DATA · SYNC</div><div class="name" style="font-size:40px">Back office</div></div>
  <div class="sec"><div class="sec-h"><h2>Body data</h2><span class="tiny mono mut">ALL OPTIONAL · AUTO-CALC</span></div><div class="card">
   <div class="grid3"><label><div class="fl">Age</div><input inputmode="numeric" data-prof="age" value="${p.age}"></label><label><div class="fl">Height cm</div><input inputmode="decimal" data-prof="height" value="${p.height}"></label><label><div class="fl">Start kg</div><input inputmode="decimal" data-prof="startWeight" value="${p.startWeight}"></label></div>
   <label><div class="fl" style="margin-top:10px">Daily activity</div><select data-prof="act">${[[1.35,'Mostly desk'],[1.5,'Mixed: desk, moving, driving'],[1.65,'On my feet a lot']].map(([v,l])=>`<option value="${v}" ${+p.act===v?'selected':''}>${l}</option>`).join('')}</select></label>
   <hr class="sep"><div class="fl">Measurements today (cm)</div><div class="grid3" style="margin-top:6px">${[['waist','Waist'],['shoulders','Shoulders'],['chest','Chest'],['arm','Arm (flexed)'],['thigh','Thigh'],['neck','Neck']].map(([k,l])=>`<label><div class="tiny mut">${l}</div><input inputmode="decimal" data-meas="${k}" placeholder="${lm(k)!=null?fmt(lm(k),1):'–'}"></label>`).join('')}</div>
   <button class="btn pri wide" style="margin-top:10px" data-act="saveMeas">Save measurements</button>
   <div class="small mut" style="margin-top:8px">Body fat est.: <b>${navyBF()?fmt(navyBF(),1)+'%':'–'}</b> ${why('bf')} · Shoulder:waist: <b>${lm('shoulders')&&lm('waist')?fmt(lm('shoulders')/lm('waist'),3):'–'}</b> ${why('ratio')}</div>
   <div class="tiny mut" style="margin-top:6px">Measure every 2 weeks, Saturday morning: waist at the navel, shoulders around the widest point, arm flexed.</div></div></div>
  <div class="sec"><div class="sec-h"><h2>🎵 Power song</h2></div><div class="card"><input id="songIn" placeholder="Paste a YouTube/Spotify link" value="${esc(S.song)}"><div class="btns" style="margin-top:8px"><button class="btn sm pri" data-act="saveSong">Save</button>${S.song?`<a class="btn sm" href="${esc(S.song)}" target="_blank" rel="noopener">▶ Play</a>`:''}</div><div class="tiny mut" style="margin-top:6px">It appears in every session right before the main lift.</div></div></div>
  <div class="sec"><div class="sec-h"><h2>🔄 Sync with Coach Ibrahim</h2></div><div class="card"><div class="small mut">Sends one WhatsApp message with a link that carries all your data (compressed). Nothing goes to any server. Merging never deletes anything.</div><a class="btn pri wide" style="margin-top:10px" data-href="sync" href="#" target="_blank" rel="noopener">🔄 Send my data</a><div class="tiny mut" style="margin-top:6px">Rule: only one person logs the same session.</div></div></div>
  <div class="sec"><div class="sec-h"><h2>📊 Reports</h2></div><div class="card"><div class="btns"><a class="btn sm" data-href="repDay" href="#" target="_blank" rel="noopener">Today</a><a class="btn sm" data-href="repWeek" href="#" target="_blank" rel="noopener">Week</a><a class="btn sm" data-href="repMonth" href="#" target="_blank" rel="noopener">Month</a></div><div class="tiny mut" style="margin-top:6px">Ready-made WhatsApp report for Coach Ibrahim.</div></div></div>
  <div class="sec"><div class="sec-h"><h2>💾 Backup</h2></div><div class="card"><button class="btn wide" data-act="mkBackup">Create backup code</button><textarea id="bkOut" class="hide" readonly style="margin-top:8px;min-height:90px;font-family:var(--mono);font-size:12px"></textarea>
   <hr class="sep"><div class="fl">Restore / add data</div><textarea id="bkIn" placeholder="Paste a backup code or sync link" style="margin-top:6px;min-height:70px;font-family:var(--mono);font-size:12px"></textarea><button class="btn wide" style="margin-top:8px" data-act="restore">Restore (merge, nothing is deleted)</button></div></div>
  <div class="sec"><div class="sec-h"><h2>📱 Add to home screen</h2></div><div class="card small mut">iPhone (Safari): Share → Add to Home Screen. Android (Chrome): ⋮ → Add to Home screen. Your data lives on this phone; make a backup now and then.</div></div>
  <div class="sec"><div class="sec-h"><h2>Coach mode</h2></div><div class="card"><label class="between"><span><b>Coach Ibrahim's phone</b><div class="tiny mut">Send buttons go to the client. Adds the consistency radar to reports. Not synced.</div></span><input type="checkbox" data-act2="coach" ${coach.on?'checked':''} style="width:24px;height:24px"></label>${coach.on?`<input style="margin-top:10px" id="cNum" placeholder="Client WhatsApp e.g. 2010…" value="${esc(coach.num)}" inputmode="tel"><div class="small mut" style="margin-top:10px;white-space:pre-line">${esc(radar())}</div>`:''}</div></div>
  <div class="sec"><div class="sec-h"><h2>Appearance</h2></div><div class="card"><div class="opt c3" style="margin:0">${[['auto','◐','Auto'],['light','☀️','Light'],['dark','🌙','Dark']].map(([k,e,l])=>`<button class="op ${themeGet()===k?'on':''}" data-act="theme" data-t="${k}"><span class="e">${e}</span>${l}</button>`).join('')}</div></div></div>
  <div class="sec"><button class="btn ghost wide sm" data-act="reset">Reset everything on this phone</button></div>
  <div class="foot">$ISML v1 · COACH IBRAHIM · <a href="https://wa.me/${COACH_WA}" target="_blank" rel="noopener">WHATSAPP</a></div>`;return h}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.prof){const v=num(t.value);if(v){S.profile[t.dataset.prof]=v;save();toast('Saved · targets updated')}}
  if(t.dataset&&t.dataset.act2==='coach'){coach.on=t.checked;render(true)}if(t.id==='cNum'){coach.num=t.value.trim();toast('Client number saved')}});
ACT.saveMeas=()=>{const o={};$$('[data-meas]').forEach(i=>{const v=num(i.value);if(v)o[i.dataset.meas]=v});if(!Object.keys(o).length)return toast('Enter at least one measurement');addMeasure(o);toast('📏 Saved');render(true)};
ACT.saveSong=()=>{S.song=$('#songIn').value.trim();save();toast('🎵 Saved');render(true)};
ACT.mkBackup=async()=>{const t=$('#bkOut');t.value=await encodeData(syncPayload());t.classList.remove('hide');t.select();try{await navigator.clipboard.writeText(t.value);toast('📋 Backup code copied')}catch(e){toast('Select and copy the code')}};
ACT.restore=async()=>{let v=$('#bkIn').value.trim();if(!v)return toast('Paste a code first');const m=v.match(/#sync=([A-Za-z0-9_\-]+)/);if(m)v=m[1];try{const o=await decodeData(v);const n=mergeIn(o);updatePrice();checkBadges();toast(`✓ Merged · ${n} new session${n===1?'':'s'}`);render()}catch(e){toast('That code is not valid')}};
ACT.reset=()=>confirmBox('Reset everything?','All sessions, weights and settings on this phone will be deleted. Make a backup first.','Delete all',()=>{localStorage.removeItem(STORE);localStorage.removeItem(PHOTO_KEY);load();VIEW='market';render();toast('Reset done')});

/* ================= sync import from link ================= */
async function checkHash(){const m=location.hash.match(/^#sync=([A-Za-z0-9_\-]+)/);if(!m)return;let o;try{o=await decodeData(m[1])}catch(e){toast('Sync link is broken or cut off');history.replaceState(null,'',pageURL());return}
  const ds=(o.sessions||[]).filter(s=>s.end);const have=new Set(S.sessions.map(s=>s.id));const nw=ds.filter(s=>!have.has(s.id)).length;const last=ds.sort((a,b)=>b.start-a.start)[0];
  window.__SYNC=o;sheet(`<h3>🔄 Sync data received</h3><div class="small mut">From ${esc((o.profile&&o.profile.name)||'Ismail')}</div><div class="grid3" style="margin:12px 0"><div class="kpi"><div class="v">${ds.length}</div><div class="l">sessions</div></div><div class="kpi"><div class="v up">${nw}</div><div class="l">new here</div></div><div class="kpi"><div class="v">${o.price?pc(o.price.ath):'–'}</div><div class="l">stock</div></div></div>${last?`<div class="small mut">Last session: ${esc(PLAN[last.day]?PLAN[last.day].name:'')} · ${fmtD(new Date(last.start))}</div>`:''}<button class="btn pri wide" style="margin-top:12px" data-act="syncAdd">Add to this phone</button><div class="tiny mut" style="margin-top:6px">Merging never deletes anything already here.</div>`)}
ACT.syncAdd=()=>{const n=mergeIn(window.__SYNC);updatePrice();checkBadges();history.replaceState(null,'',pageURL());closeSheet();toast(`✓ Added · ${n} new session${n===1?'':'s'}`);render()};

/* ================= init ================= */
load();updatePrice();checkBadges();if(S.active&&!S.active.day)S.active=null;VIEW=S.active?'session':'market';render();checkHash();
window.addEventListener('hashchange',checkHash);

</script>
</body>
